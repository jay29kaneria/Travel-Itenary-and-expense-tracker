<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – Travel Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">

    <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">

        <div class="mb-6 text-center">
            <div class="text-4xl mb-2">✈️</div>
            <h1 class="text-3xl font-bold text-slate-900">Admin Login</h1>
            <p class="mt-1 text-slate-500">Travel Itinerary & Expense Tracker</p>
        </div>

        <div id="message" class="mb-4 hidden rounded-lg p-3"></div>

        <form id="loginForm" class="space-y-4">

            <div>
                <label for="email" class="mb-1 block font-semibold text-slate-700">Email Address</label>
                <input type="email" id="email" required
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                    placeholder="admin@travel.com">
            </div>

            <div>
                <label for="password" class="mb-1 block font-semibold text-slate-700">Password</label>
                <input type="password" id="password" required
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                    placeholder="Enter your password">
            </div>

            <button type="submit"
                class="w-full rounded-lg bg-indigo-600 py-3 font-semibold text-white hover:bg-indigo-700 transition">
                Login
            </button>

        </form>

        <p class="mt-5 text-center text-slate-600">
            Don't have an account?
            <a href="signup.html" class="font-semibold text-indigo-600 hover:underline">Sign Up</a>
        </p>

    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('adminName', data.admin.name);
                    localStorage.setItem('role', 'admin');

                    showMessage('Login successful! Redirecting...', true);
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } else {
                    showMessage(data.message || 'Invalid email or password', false);
                }

            } catch (error) {
                showMessage('Cannot connect to server. Start your Node.js server.', false);
            }
        });

        function showMessage(text, success) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = 'mb-4 rounded-lg p-3 ' +
                (success ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700');
            message.classList.remove('hidden');
        }
    </script>

</body>
</html>
